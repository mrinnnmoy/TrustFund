name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  program:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install 1.1.2
          avm use 1.1.2
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Build and test program
        working-directory: program
        run: |
          anchor build
          anchor test --skip-deploy

      - name: Normalize IDL program address
        run: |
          node -e '
            const fs = require("fs");
            const path = "program/target/idl/trustfund.json";
            const idl = JSON.parse(fs.readFileSync(path, "utf8"));
            idl.address = "AYsmGT97ZmgfJmzBxLQ7om8sMGkiCTLNZEf9otevg1g3";
            fs.writeFileSync(path, JSON.stringify(idl, null, 2) + "\n");
          '

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate Codama client
        run: pnpm codegen

      - name: Verify generated client is current
        run: git diff --exit-code -- lib/generated/
